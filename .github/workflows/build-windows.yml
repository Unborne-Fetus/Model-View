name: Build Model View Desktop Tools
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['gfpak_open/**', 'web/**', 'run.bat', 'package*.json', 'vite.config.js', '.github/workflows/build-windows.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native NCA reader crypto dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=44,<48" "zstandard>=0.23,<1" "lz4>=4,<5"
      - name: Test legacy archive readers
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install viewer test dependencies
        run: npm ci --no-audit --no-fund
      - name: Test desktop effect preview and viewer libraries
        run: npm test
      - name: Build portable EXE through run.bat
        shell: cmd
        run: call run.bat --build-only
      - uses: actions/upload-artifact@v6
        with:
          name: Model-View-Windows
          path: dist/Model-View.exe
