name: Deploy Model View Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: model-view-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Test model tools and legacy decoders
        run: npm test
      - name: Install Chromium browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test viewer, editor, printer profiles and exports
        run: npx playwright test --project=chromium
      - name: Build production static site
        run: npm run build
      - name: Upload standalone site as downloadable artifact
        uses: actions/upload-artifact@v6
        with:
          name: model-view-static-site
          path: dist-web/
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web/

  check-pages:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check GitHub Pages repository configuration
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/pages")
          if [ "$status" = "404" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Settings -> Pages -> Build and deployment -> Source: GitHub Actions."
            {
              echo "### Setup needed: enable GitHub Pages"
              echo "The site compiled successfully and can be downloaded as **model-view-static-site** from this run."
              echo "GitHub Pages is not enabled, so publication cannot proceed yet."
              echo "Open https://github.com/$GH_REPOSITORY/settings/pages and set **Build and deployment → Source** to **GitHub Actions**."
              echo "Then rerun **Deploy Model View Web** using **Run workflow**."
              echo "The default GITHUB_TOKEN cannot enable Pages for a repository by itself."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" = "200" ]; then
            build_type=$(jq -r '.build_type // "unknown"' pages.json)
            if [ "$build_type" != "workflow" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Pages uses '$build_type' rather than GitHub Actions. Switch its Source to GitHub Actions."
              echo "### Fix Pages source: Settings → Pages → GitHub Actions (currently $build_type)." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is enabled for GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::error::Unable to check GitHub Pages setup (HTTP $status)."
            cat pages.json
            exit 1
          fi

  deploy:
    if: needs.check-pages.outputs.ready == 'true'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: [build, check-pages]
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Report deployment URL
        if: success()
        shell: bash
        run: echo "Model View deployed to https://unborne-fetus.github.io/Model-View/" >> "$GITHUB_STEP_SUMMARY"
